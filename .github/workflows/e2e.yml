---
name: Babbel E2E

"on":
  push:
    branches: [main]
    paths:
      - '**/*.php'
      - 'assets/**'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - 'tsconfig.json'
      - 'tests/playwright/**'
      - 'tests/e2e/**'
      - '.github/workflows/e2e.yml'
  pull_request:
  schedule:
    - cron: '30 4 * * 0'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Restores in two requests; the plugin parks stories and falls back.
          - name: WordPress to Babbel (v0.17.0)
            babbel_ref: 0b7393b2bda9b3779f7b3747e077718ab0649435
          # Restores and updates in one request (oszuidwest/zwfm-babbel#342).
          - name: WordPress to Babbel (atomic restore)
            babbel_ref: 771f47a5a77911ec84d1cfa7c78e029ee73430d3
          # Repeats a create with the same idempotency key safely (oszuidwest/zwfm-babbel#343).
          - name: WordPress to Babbel (idempotent create)
            babbel_ref: b1157d2e1b58c8faec740c0158cd204ddf1fff60

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v7
        with:
          path: zw-knabbel-wp
          persist-credentials: false

      - name: Checkout Babbel
        uses: actions/checkout@v7
        with:
          repository: oszuidwest/zwfm-babbel
          # Pull requests use a known-compatible contract. The weekly run follows
          # main so upstream compatibility regressions remain visible.
          ref: ${{ github.event_name == 'schedule' && 'main' || matrix.babbel_ref }}
          path: zwfm-babbel
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: zw-knabbel-wp/package-lock.json

      - name: Install plugin dependencies
        working-directory: zw-knabbel-wp
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist

      - name: Install browser test dependencies
        working-directory: zw-knabbel-wp
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('zw-knabbel-wp/package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      # OS packages live outside the cached directory and the runner is ephemeral,
      # so system dependencies must be installed on every run. Only the browser
      # binaries themselves come from the cache.
      - name: Install Chromium system dependencies
        working-directory: zw-knabbel-wp
        run: npx playwright install-deps chromium

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: zw-knabbel-wp
        run: npx playwright install chromium

      - name: Run E2E suite
        working-directory: zw-knabbel-wp
        env:
          BABBEL_PATH: ${{ github.workspace }}/zwfm-babbel
        run: tests/e2e/run.sh

      - name: Upload E2E artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: babbel-e2e-logs-${{ strategy.job-index }}
          path: |
            zw-knabbel-wp/tests/e2e/artifacts/
            zw-knabbel-wp/playwright-report/
            zw-knabbel-wp/test-results/
          if-no-files-found: warn
          retention-days: 7

  # The required check: passes only when the suite passes against every Babbel version.
  e2e-result:
    name: WordPress to Babbel
    needs: e2e
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every Babbel version to pass
        env:
          RESULT: ${{ needs.e2e.result }}
        run: test "$RESULT" = success
